<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101114">
  <title>Failed to install</title>

  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #101114;
      color: #f4f4f5;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: radial-gradient(ellipse at 50% 42%, #242631 0%, #101114 68%);
    }

    main {
      width: min(100%, 560px);
      padding: 48px 32px;
      text-align: center;
      border: 1px solid #ffffff1a;
      border-radius: 20px;
      background: #18191ee8;
      box-shadow: 0 24px 80px #0007;
      animation: appear 650ms ease-out both;
    }

    .brand {
      margin-bottom: 30px;
      color: #a7aab8;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .icon {
      width: 68px;
      height: 68px;
      margin: 0 auto 22px;
      display: grid;
      place-items: center;
      border: 1px solid #ff68684d;
      border-radius: 20px;
      background: #ff686813;
      color: #ff7777;
      font-size: 32px;
      animation: pulse 2.2s ease-in-out infinite;
    }

    .code {
      margin: 0;
      color: #ff7777;
      font-size: clamp(4rem, 16vw, 7rem);
      font-weight: 800;
      letter-spacing: -0.08em;
      line-height: 1;
    }

    h1 {
      margin: 18px 0 10px;
      font-size: clamp(1.25rem, 5vw, 1.7rem);
    }

    .message {
      margin: 0 auto;
      max-width: 38ch;
      color: #a6a6b0;
      line-height: 1.6;
    }

    button {
      margin-top: 26px;
      padding: 11px 19px;
      border: 0;
      border-radius: 9px;
      background: #ff7777;
      color: #1b1111;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      transition: background 160ms ease, transform 160ms ease;
    }

    button:hover {
      background: #ff9292;
      transform: translateY(-2px);
    }

    button:focus-visible {
      outline: 3px solid #fff;
      outline-offset: 4px;
    }

    #status {
      min-height: 1.5em;
      margin-top: 14px;
      color: #a6a6b0;
      font-size: 0.9rem;
    }

    .divider {
      width: 42px;
      height: 3px;
      margin: 18px auto 0;
      border-radius: 3px;
      background: #ff7777;
      opacity: 0.75;
    }

    @keyframes appear {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes pulse {
      50% { box-shadow: 0 0 26px #ff68682b; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>
<body>
  <main>
    <div class="brand">TrevVM</div>
    <div class="icon" aria-hidden="true">!</div>
    <p class="code">404</p>
    <h1>Failed to install properly</h1>
    <p class="message">TrevVM couldn't install. Re-install and try again.</p>

    <button id="closeTab" type="button">Close tab</button>
    <div id="status" role="status" aria-live="polite"></div>
    <div class="divider" aria-hidden="true"></div>
  </main>

  <script>
    document.getElementById("closeTab").addEventListener("click", () => {
      window.close();

      // Show this if the browser blocks the page from closing the tab.
      setTimeout(() => {
        document.getElementById("status").textContent =
          "Your browser wouldn't let this page close the tab. You can close it manually.";
      }, 300);
    });
  </script>
</body>
</html>
