name: Shell checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell-check:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck

      - name: Check shell syntax and lint
        shell: bash
        run: |
          mapfile -d '' shell_files < <(git ls-files -z -- '*.sh' '*.bash')

          if ((${#shell_files[@]} == 0)); then
            echo "No tracked shell files found."
            exit 0
          fi

          for file in "${shell_files[@]}"; do
            echo "Checking syntax: $file"
            bash -n "$file"
          done

          shellcheck --severity=error "${shell_files[@]}"
